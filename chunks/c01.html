<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CallHome — Never Ring at the Wrong Hour</title>
<meta name="description" content="Live world clocks, best-time-to-call windows and call plans for the people you love — across every time zone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf3e7; --paper2:#f3e8d3; --card:#fffdf7; --ink:#2b1d12; --ink2:#5c4632;
  --mut:#8a7360; --line:#e6d9c2; --line2:#d9c6a4; --bronze:#b07d2b; --gold:#d9a441;
  --gold-soft:#f6e3bd; --terra:#c05b2e; --terra-d:#9c4520; --terra-soft:#f9e2d4;
  --green:#3f7a4e; --green-soft:#dcebd9; --night:#3a2c22; --night2:#241a12;
  --shadow:0 10px 30px rgba(43,29,18,.10); --shadow-lg:0 24px 60px rgba(43,29,18,.18);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:650;letter-spacing:-.01em}
a{color:var(--terra-d)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.kicker{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}
.muted{color:var(--mut)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;border:1px solid var(--line2);background:var(--card)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.pill.awake{background:var(--green-soft);border-color:#bcd8b4;color:#2c5a38}
.pill.asleep{background:#ece2d2;border-color:#d8c8ac;color:#6d5a44}
.pill.gold{background:var(--gold-soft);border-color:#e8c98a;color:#7a5a16}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:11px 20px;font-weight:700;font-size:14.5px;text-decoration:none}
.btn:hover{background:#3d2a1a}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink);background:var(--card)}
.btn.terra{background:var(--terra);border-color:var(--terra)}
.btn.terra:hover{background:var(--terra-d)}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{padding:34px 0 8px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{margin:4px 0 0;font-size:30px;line-height:1.15}
.sec-head p{margin:6px 0 0;color:var(--ink2);max-width:640px}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 100% at 50% 0%,#4a2f1a 0%,#2b1d12 55%,#1d130b 100%);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s ease,visibility .6s}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#intro .glyph{width:86px;height:86px;border-radius:50%;border:1.5px solid rgba(217,164,65,.7);display:flex;align-items:center;justify-content:center;animation:spinSlow 9s linear infinite;margin-bottom:22px}
#intro .glyph svg{animation:spinSlow 9s linear infinite reverse}
@keyframes spinSlow{to{transform:rotate(360deg)}}
#intro h1{margin:0;font-size:clamp(38px,8vw,64px);line-height:1.02}
#intro h1 .st{display:block;opacity:0;transform:translateY(16px);animation:rise .8s ease forwards}
#intro h1 .st:nth-child(2){animation-delay:.35s;color:var(--gold)}
#intro h1 .st:nth-child(3){animation-delay:.7s;font-size:.42em;font-family:Inter,sans-serif;font-weight:500;letter-spacing:.02em;color:#e8d9bd}
@keyframes rise{to{opacity:1;transform:none}}
#intro .bar{width:min(300px,70vw);height:5px;border-radius:99px;background:rgba(250,243,231,.18);margin-top:30px;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;animation:barFill 3.4s ease forwards}
@keyframes barFill{to{width:100%}}
#skipIntro{position:absolute;bottom:26px;right:26px;background:transparent;border:1px solid rgba(250,243,231,.5);color:var(--paper);border-radius:999px;padding:9px 18px;font-weight:700}
#skipIntro:hover{background:rgba(250,243,231,.12)}
/* ---------- masthead ---------- */
header.mast{position:sticky;top:0;z-index:60;background:rgba(250,243,231,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mast-in{display:flex;align-items:center;gap:14px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .mark{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:800;font-size:19px}
.logo b{font-family:Fraunces,serif;font-size:21px;letter-spacing:-.01em}
.logo small{display:block;font-family:Inter,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--bronze);text-transform:uppercase}
.mast-clock{margin-left:auto;text-align:right;line-height:1.25}
.mast-clock b{font-size:19px;font-variant-numeric:tabular-nums}
.mast-clock span{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.mast nav{display:flex;gap:4px}
.mast nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:14px}
.mast nav a:hover{background:var(--paper2);color:var(--ink)}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09) translate(-1%,-1.5%)}}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,19,11,.62) 0%,rgba(29,19,11,.28) 45%,rgba(29,19,11,.78) 100%)}
.hero-in{position:relative;padding:74px 20px 150px;max-width:1120px;margin:0 auto;color:#fdf8ee}
.hero h1{font-size:clamp(38px,6.4vw,62px);line-height:1.04;margin:10px 0 14px;max-width:640px;text-shadow:0 2px 22px rgba(0,0,0,.35)}
.hero h1 em{color:var(--gold);font-style:normal}
.hero p.lede{font-size:18px;line-height:1.6;max-width:560px;color:#f3e8d3;margin:0 0 22px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-cta .btn{border-color:#f6e3bd}
.hero-cta .btn.ghost{color:#fdf8ee;border-color:rgba(253,248,238,.6)}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:30px}
.hero-stats div b{display:block;font-family:Fraunces,serif;font-size:26px}
.hero-stats div span{font-size:12.5px;color:#e8d9bd;font-weight:600}
/* @@NEXT@@ */
</style>
</head>
<body>
